name: Multi-replica tests

# The replication tests on a three-replica ClickHouse cluster (./gradlew multiReplicaTest), which the main PR build
# leaves out. They run on a PR into development or release-*, and after a merge into development, when the change
# matches the path filter. The filter is deliberately wide: any change to production code or resources, or to a test
# helper (a test source not named *Test.java, such as the container supports, IntegrationTables or RunnerCalls), runs
# them; a change touching only docs, specs or other test classes does not. Later patterns override earlier ones, so
# the multi-replica test classes are added back after the *Test.java exclusion. GitHub matches the filter against the
# first 300 changed files only, so a larger change may skip the run: dispatch it by hand then. A PR runs the
# default server version beside the main PR build, so it adds no wall-clock time; the post-merge and manual runs also
# run the supported floor, 25.3.

on:
  pull_request:
    branches: [development, release-*]
    paths:
      - "src/main/**"
      - "src/test/java/**"
      - "!src/test/java/**/*Test.java"
      - "src/test/java/**/MultiReplica*IntegrationTest.java"
      - "src/test/resources/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/multi-replica.yml"
  push:
    branches: [development]
    # The same filter as pull_request.
    paths:
      - "src/main/**"
      - "src/test/java/**"
      - "!src/test/java/**/*Test.java"
      - "src/test/java/**/MultiReplica*IntegrationTest.java"
      - "src/test/resources/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/multi-replica.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# packages: read lets GITHUB_TOKEN resolve the GitHub Packages dependency (build.gradle, epam/jclouds) when the
# Gradle cache misses, as on a dependency bump.
permissions:
  contents: read
  packages: read

jobs:
  multi_replica_test:
    name: multiReplicaTest (ClickHouse ${{ matrix.clickhouse }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        clickhouse: ${{ fromJSON(github.event_name == 'pull_request' && '["26.8"]' || '["25.3", "26.8"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: epam/ai-dial-ci/actions/java_prepare@5.1.0
        with:
          java-version: 25
      - name: Run multiReplicaTest
        run: ./gradlew multiReplicaTest
        env:
          CLICKHOUSE_TEST_VERSION: ${{ matrix.clickhouse }}
          GPR_USERNAME: ${{ github.actor }}
          GPR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      # cancelled() as well: a cluster that never recovers ends the job on its timeout, which is reported as cancelled.
      - name: Upload test reports
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: multi-replica-reports-${{ matrix.clickhouse }}
          path: |
            build/reports/tests/multiReplicaTest/
            build/test-results/multiReplicaTest/
          retention-days: 14
