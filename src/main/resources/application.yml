spring:
  application:
    name: ai-dial-analytics
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE:testdb}?${POSTGRES_OPS:}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_DATASOURCE_USERNAME:postgres}
    password: ${POSTGRES_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        cdi:
          extensions: true
      org:
        hibernate:
          envers:
            store_data_at_delete: true
  flyway:
    enabled: ${POSTGRES_MIGRATIONS_ENABLED:true}
    locations: classpath:db/migration/postgres
  task:
    scheduling:
      pool:
        size: ${SCHEDULING_POOL_SIZE:4}
  servlet:
    multipart:
      max-file-size: ${CATALOG_IMPORT_MAX_FILE_SIZE:20MB}
      max-request-size: ${CATALOG_IMPORT_MAX_REQUEST_SIZE:25MB}

server:
  port: ${HTTP_PORT:5000}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9464}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  opentelemetry:
    resource-attributes:
      "service.name": ${OTEL_SERVICE_NAME:ai-dial-analytics}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces}
          transport: ${OTEL_EXPORTER_OTLP_PROTOCOL:http}
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs}
          transport: ${OTEL_EXPORTER_OTLP_PROTOCOL:http}
  tracing:
    enabled: ${OTEL_TRACES_EXPORT_ENABLED:${OTEL_EXPORT_ENABLED:false}}
    export:
      enabled: ${OTEL_TRACES_EXPORT_ENABLED:${OTEL_EXPORT_ENABLED:false}}
    sampling:
      probability: ${OTEL_TRACES_SAMPLING_PROBABILITY:1.0}
  logging:
    export:
      otlp:
        enabled: ${OTEL_LOGS_EXPORT_ENABLED:${OTEL_EXPORT_ENABLED:false}}
  otlp:
    metrics:
      export:
        enabled: ${OTEL_METRICS_EXPORT_ENABLED:${OTEL_EXPORT_ENABLED:false}}
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics}

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}

logging:
  level:
    com.epam.aidial.analytics: ${APP_LOG_LEVEL:INFO}

observability:
  log-levels:
    path: ${LOG_CONFIG_PATH:/app/log-config/logging.levels.json}
    interval: ${LOG_CONFIG_INTERVAL:10s}
  execution-trace:
    enabled: ${EXECUTION_TRACE_ENABLED:true}

clickhouse:
  host: ${CLICKHOUSE_HOST:localhost}
  port: ${CLICKHOUSE_PORT:8123}
  database: ${CLICKHOUSE_DATABASE:}
  user: ${CLICKHOUSE_USER:default}
  password: ${CLICKHOUSE_PASSWORD:}
  writer:
    user: ${CLICKHOUSE_WRITER_USER:default}
    password: ${CLICKHOUSE_WRITER_PASSWORD:}
  migrations:
    enabled: ${CLICKHOUSE_MIGRATIONS_ENABLED:true}

blob:
  provider: ${BLOB_PROVIDER:azureblob}
  identity: ${BLOB_IDENTITY:}
  credential: ${BLOB_CREDENTIAL:}
  bucket: ${BLOB_BUCKET:logs}
  endpoint: ${BLOB_ENDPOINT:}

sync:
  cron: ${SYNC_CRON:0 0 1 * * *}
  day-offset: ${SYNC_DAY_OFFSET:1}
  batch-size: ${SYNC_BATCH_SIZE:10000}
  max-batch-bytes: ${SYNC_MAX_BATCH_BYTES:134217728}
  max-line-bytes: ${SYNC_MAX_LINE_BYTES:67108864}
  path-prefix: ${SYNC_PATH_PREFIX:logs}
  date-path-pattern: ${SYNC_DATE_PATH_PATTERN:yyyy/MM/dd}
  file-name-prefix-pattern: ${SYNC_FILE_NAME_PREFIX_PATTERN:'date='yyyy-MM-dd}
  validate-schema: ${SYNC_VALIDATE_SCHEMA:true}
  inline-files-mode: ${SYNC_INLINE_FILES_MODE:drop-truncated}
  targets:
    - table: ${SYNC_TABLE:dial_usage_log}
      mapping-file: ${SYNC_MAPPING_FILE:classpath:mapping/dial-usage-log.yaml}
    - table: ${SYNC_PAYLOAD_TABLE:dial_usage_log_payload}
      mapping-file: ${SYNC_PAYLOAD_MAPPING_FILE:classpath:mapping/dial-usage-log-payload.yaml}
    - table: ${SYNC_RATE_TABLE:rate_analytics}
      mapping-file: ${SYNC_RATE_MAPPING_FILE:classpath:mapping/rate-analytics.yaml}

poll:
  enabled: ${POLL_ENABLED:true}
  poll-cron: ${POLL_CRON:0 * * * * *}
  overlap: ${POLL_OVERLAP:5m}
  restart-lookback: ${POLL_RESTART_LOOKBACK:1h}
  previous-day-grace: ${POLL_PREVIOUS_DAY_GRACE:1h}
  finalization-lag: ${POLL_FINALIZATION_LAG:15m}
  listing-mode: ${POLL_LISTING_MODE:band}

backfill:
  enabled: ${BACKFILL_ENABLED:true}
  max-days: ${BACKFILL_MAX_DAYS:366}

tables:
  limits:
    max-columns-per-table: ${TABLES_MAX_COLUMNS_PER_TABLE:256}
    max-tables: ${TABLES_MAX_TABLES:1000}
    max-write-batch-rows: ${TABLES_MAX_WRITE_BATCH_ROWS:10000}

otel-sink:
  enabled: ${OTEL_SINK_ENABLED:true}
  max-rows-per-request: ${OTEL_MAX_ROWS_PER_REQUEST:50000}
  default-retention-days: ${OTEL_DEFAULT_RETENTION_DAYS:30}

enrichment:
  scan:
    safety-lag: ${ENRICHMENT_SCAN_SAFETY_LAG:5s}
    default-limit: ${ENRICHMENT_SCAN_DEFAULT_LIMIT:1000}
    max-limit: ${ENRICHMENT_SCAN_MAX_LIMIT:10000}
  materialize:
    default-limit: ${ENRICHMENT_MATERIALIZE_DEFAULT_LIMIT:10000}
    max-limit: ${ENRICHMENT_MATERIALIZE_MAX_LIMIT:100000}
  group-fetch:
    default-rows: ${ENRICHMENT_GROUP_FETCH_DEFAULT_ROWS:200}
    max-rows: ${ENRICHMENT_GROUP_FETCH_MAX_ROWS:2000}
    max-bytes: ${ENRICHMENT_GROUP_FETCH_MAX_BYTES:8MB}
  provenance-reconcile:
    enabled: ${ENRICHMENT_PROVENANCE_RECONCILE_ENABLED:true}
  cursor:
    active-key-id: ${ENRICHMENT_CURSOR_ACTIVE_KEY_ID:k1}
    keys:
      - id: ${ENRICHMENT_CURSOR_KEY_ID:k1}
        secret: ${ENRICHMENT_CURSOR_SECRET:}

aggregate:
  enabled: ${AGGREGATE_ENABLED:true}
  tick-cron: ${AGGREGATE_TICK_CRON:0 * * * * *}
  scheduler-pool-size: ${AGGREGATE_SCHEDULER_POOL_SIZE:1}
  safety-lag: ${AGGREGATE_SAFETY_LAG:5s}
  window-limit: ${AGGREGATE_WINDOW_LIMIT:100000}
  preview-rows: ${AGGREGATE_PREVIEW_ROWS:5}
  preview:
    timeout: ${AGGREGATE_PREVIEW_TIMEOUT:30s}
    max-memory: ${AGGREGATE_PREVIEW_MAX_MEMORY:2GB}
    spill-threshold: ${AGGREGATE_PREVIEW_SPILL_THRESHOLD:1GB}

flight:
  enabled: ${FLIGHT_ENABLED:false}
  port: ${FLIGHT_PORT:32010}
  batch-rows: ${FLIGHT_BATCH_ROWS:1024}
  batch-max-bytes: ${FLIGHT_BATCH_MAX_BYTES:4194304}
  max-concurrent-streams: ${FLIGHT_MAX_CONCURRENT_STREAMS:4}
  request-memory-limit-bytes: ${FLIGHT_REQUEST_MEMORY_LIMIT_BYTES:67108864}
  max-rows: ${FLIGHT_MAX_ROWS:10000}

query:
  force-final: ${FORCE_FINAL_QUERIES:true}
  budget:
    timeout: ${QUERY_BUDGET_TIMEOUT:20s}
    max-memory: ${QUERY_BUDGET_MAX_MEMORY:2GB}
    spill-threshold: ${QUERY_BUDGET_SPILL_THRESHOLD:1GB}

pipeline:
  budget:
    timeout: ${PIPELINE_BUDGET_TIMEOUT:120s}
    max-memory: ${PIPELINE_BUDGET_MAX_MEMORY:2GB}

saved-queries:
  max-body-bytes: ${SAVED_QUERIES_MAX_BODY_BYTES:65536}

security:
  mode: ${SECURITY_MODE:none}
  require-email: ${SECURITY_REQUIRE_EMAIL:false}
  disable-swagger-authorization: ${DISABLE_SWAGGER_AUTHORIZATION:false}
  defaults:
    roles-mapping: "${SECURITY_ROLES_MAPPING:{\"ConfigAdmin\":[\"FULL_ADMIN\"],\"admin\":[\"FULL_ADMIN\"]}}"
    email-claim: ${SECURITY_EMAIL_CLAIM:unique_name}
    principal-claim: ${SECURITY_USER_CLAIM:oid}
  api-key:
    enabled: ${API_KEY_ENABLED:false}
    core-url: ${API_KEY_CORE_URL:}
    cache-ttl-seconds: ${API_KEY_CACHE_TTL_SECONDS:60}
    cache-max-size: ${API_KEY_CACHE_MAX_SIZE:10000}
    request-timeout-ms: ${API_KEY_REQUEST_TIMEOUT_MS:3000}
    roles-mapping: "${API_KEY_ROLES_MAPPING:}"
    startup-probe: ${API_KEY_STARTUP_PROBE:true}
