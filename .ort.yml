---
analyzer:
  skip_excluded: true
  package_managers:
    GradleInspector:
      options:
        # Bypass foojay Temurin JDK auto-provisioning (https://github.com/foojayio/discoapi/issues/165)
        # by downloading a fixed Temurin 25 build directly; overrides the javaVersion option set by ai-dial-ci.
        # Remove once the foojay API is fixed.
        customJdkUrl: "https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.4.1%2B1/OpenJDK25U-jdk_x64_linux_hotspot_25.0.4.1_1.tar.gz"
excludes:
  scopes:
    - pattern: "annotationProcessor"
      reason: "BUILD_DEPENDENCY_OF"
      comment: "Packages to process code annotations only."
    - pattern: "checkstyle"
      reason: "DEV_DEPENDENCY_OF"
      comment: "Packages for static code analysis only."
    - pattern: "lombok"
      reason: "DEV_DEPENDENCY_OF"
      comment: "Packages from Project Lombok only."
    - pattern: "test.*"
      reason: "TEST_DEPENDENCY_OF"
      comment: "Packages for testing only."
